        slowPeriod: 26
        signalPeriod: 9
        histogramScale: 0.5

    - type: bollinger-breakout
      symbol: NSE:FINNIFTY-INDEX
      timeframe: 5m
      parameters:
        bandPeriod: 20
        stdDevMultiplier: 2.0
        atrPeriod: 14
        minBandWidthAtrMultiple: 1.5

    # ===== RELIANCE (3 voters) =====
