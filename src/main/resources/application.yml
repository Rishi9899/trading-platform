server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/trading_platform
    username: postgres
    password: root

  data:
    redis:
      host: localhost
      port: 6379

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    org.hibernate.SQL: OFF
    org.hibernate.orm.jdbc.bind: OFF
    com.tradingplatform.strategy: DEBUG
    com.tradingplatform.readiness: DEBUG
    com.tradingplatform.pattern: DEBUG

app:
  tick:
    source: fyers-sidecar
    symbols:
      - NSE:NIFTY50-INDEX
      - NSE:NIFTYBANK-INDEX
      - NSE:FINNIFTY-INDEX
      - NSE:RELIANCE-EQ
      - NSE:TCS-EQ
      - NSE:INFY-EQ
      - NSE:SBIN-EQ
      - MCX:CRUDEOIL26OCTFUT
      - MCX:GOLD26OCTFUT
      - MCX:SILVER26OCTFUT
    interval-millis: 500

  strategies:
    # ===== NIFTY50 (3 voters) =====
    - type: ema-crossover
      symbol: NSE:NIFTY50-INDEX
      timeframe: 5m
      parameters:
        fastPeriod: 9
        slowPeriod: 21
        rsiPeriod: 14
        buyRsiThreshold: 50.0
        sellRsiThreshold: 50.0

    - type: ema-crossover-mtf
      symbol: NSE:NIFTY50-INDEX
      timeframe: 5m
      confirmationTimeframe: 15m
      parameters:
        fastPeriod: 9
        slowPeriod: 21
        rsiPeriod: 14
        buyRsiThreshold: 50.0
        sellRsiThreshold: 50.0
        trendPeriod: 10

    - type: macd-momentum
      symbol: NSE:NIFTY50-INDEX
      timeframe: 5m
      parameters:
        fastPeriod: 12
        slowPeriod: 26
        signalPeriod: 9
        histogramScale: 0.5

    # ===== NIFTYBANK (3 voters) =====
    - type: ema-crossover
      symbol: NSE:NIFTYBANK-INDEX
      timeframe: 5m
      parameters:
        fastPeriod: 9
        slowPeriod: 21
        rsiPeriod: 14
        buyRsiThreshold: 50.0
        sellRsiThreshold: 50.0

    - type: ema-crossover-mtf
      symbol: NSE:NIFTYBANK-INDEX
      timeframe: 5m
      confirmationTimeframe: 15m
      parameters:
        fastPeriod: 9
        slowPeriod: 21
        rsiPeriod: 14
        buyRsiThreshold: 50.0
        sellRsiThreshold: 50.0
        trendPeriod: 10

    - type: bollinger-breakout
      symbol: NSE:NIFTYBANK-INDEX
      timeframe: 5m
      parameters:
        bandPeriod: 20
        stdDevMultiplier: 2.0
        atrPeriod: 14
        minBandWidthAtrMultiple: 1.5

    # ===== FINNIFTY (3 voters) =====
    - type: ema-crossover
      symbol: NSE:FINNIFTY-INDEX
      timeframe: 5m
      parameters:
