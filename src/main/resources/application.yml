server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/trading_platform
    username: postgres
    password: root

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    org.hibernate.SQL: OFF
    org.hibernate.orm.jdbc.bind: OFF

app:
  tick:
    source: fyers-sidecar   # fake | fyers-sidecar
    symbols:
      - NSE:NIFTY50-INDEX
      - NSE:NIFTYBANK-INDEX
      - MCX:CRUDEOIL26SEPFUT
    interval-millis: 500

  strategies:
    - type: ema-crossover
      symbol: NSE:NIFTY50-INDEX
      timeframe: 5m
      parameters:
        fastPeriod: 9
        slowPeriod: 21
        rsiPeriod: 14
        buyRsiThreshold: 50.0
        sellRsiThreshold: 50.0

    - type: ema-crossover
      symbol: NSE:NIFTYBANK-INDEX
      timeframe: 5m
      parameters:
        fastPeriod: 9
        slowPeriod: 21
        rsiPeriod: 14
        buyRsiThreshold: 50.0
        sellRsiThreshold: 50.0

    - type: ema-crossover
      symbol: MCX:CRUDEOIL26SEPFUT
      timeframe: 5m
      parameters:
        fastPeriod: 9
        slowPeriod: 21
        rsiPeriod: 14
        buyRsiThreshold: 50.0
        sellRsiThreshold: 50.0

    - type: ema-crossover-mtf
      symbol: NSE:NIFTY50-INDEX
      timeframe: 5m
      confirmationTimeframe: 15m   # downgrades signals that fight the 15m trend to HOLD
      parameters:
        fastPeriod: 9
        slowPeriod: 21
        rsiPeriod: 14
        buyRsiThreshold: 50.0
        sellRsiThreshold: 50.0
        trendPeriod: 10

  candle:
    timeframe-seconds: 60       # Base candle = 1 minute (60s)
    derived-timeframes:
      - "5m"                   # Derived higher timeframe = 5 minutes (300s)
      - "15m"                  # Confirmation timeframe for multi-timeframe strategies

  queue:
    capacity: 1000

  fyers:
    sidecar:
      url: ws://localhost:8765
      reconnect-delay-millis: 5000