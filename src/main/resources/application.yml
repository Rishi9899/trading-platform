    # ===== CRUDE OIL (4 voters) =====
    - type: donchian-breakout
      symbol: MCX:CRUDEOIL26OCTFUT
      timeframe: 5m
      parameters:
        entryPeriod: 55
        exitPeriod: 20
        atrPeriod: 20
        minAtrFraction: 0.5

    - type: ema-crossover
      symbol: MCX:CRUDEOIL26OCTFUT
      timeframe: 5m
      parameters:
        fastPeriod: 9
        slowPeriod: 21
        rsiPeriod: 14
        buyRsiThreshold: 50.0
        sellRsiThreshold: 50.0

    - type: macd-momentum
      symbol: MCX:CRUDEOIL26OCTFUT
      timeframe: 5m
      parameters:
        fastPeriod: 12
        slowPeriod: 26
        signalPeriod: 9
        histogramScale: 0.5

    - type: bollinger-breakout
      symbol: MCX:CRUDEOIL26OCTFUT
      timeframe: 5m
      parameters:
        bandPeriod: 20
        stdDevMultiplier: 2.0
        atrPeriod: 14
        minBandWidthAtrMultiple: 1.5

    # ===== GOLD (5 voters - includes pattern recognition!) =====
    - type: donchian-breakout
      symbol: MCX:GOLD26OCTFUT
      timeframe: 5m
      parameters:
        entryPeriod: 55
        exitPeriod: 20
        atrPeriod: 20
        minAtrFraction: 0.5

    - type: ema-crossover
      symbol: MCX:GOLD26OCTFUT
      timeframe: 5m
      parameters:
        fastPeriod: 13
        slowPeriod: 34
        rsiPeriod: 14
        buyRsiThreshold: 45.0
        sellRsiThreshold: 55.0

    - type: macd-momentum
      symbol: MCX:GOLD26OCTFUT
      timeframe: 5m
      parameters:
        fastPeriod: 12
        slowPeriod: 26
        signalPeriod: 9
        histogramScale: 0.5

    - type: bollinger-breakout
      symbol: MCX:GOLD26OCTFUT
      timeframe: 5m
      parameters:
        bandPeriod: 20
        stdDevMultiplier: 2.5
        atrPeriod: 14
        minBandWidthAtrMultiple: 1.5

    # ✅ NEW: Candlestick Pattern Recognition for GOLD
    - type: candlestick-pattern
      symbol: MCX:GOLD26OCTFUT
      timeframe: 5m
      parameters:
        minConfidence: 0.65
        requireTrendContext: true
        patterns:
          - Bullish Engulfing
          - Hammer
          - Morning Star
          - Bearish Engulfing
          - Evening Star
          - Shooting Star

    # ===== SILVER (4 voters) =====
    - type: donchian-breakout
      symbol: MCX:SILVER26OCTFUT
      timeframe: 5m
      parameters:
        entryPeriod: 55
        exitPeriod: 20
        atrPeriod: 20
        minAtrFraction: 0.5

    - type: ema-crossover
      symbol: MCX:SILVER26OCTFUT
      timeframe: 5m
      parameters:
        fastPeriod: 13
        slowPeriod: 34
        rsiPeriod: 14
        buyRsiThreshold: 45.0
        sellRsiThreshold: 55.0

    - type: macd-momentum
      symbol: MCX:SILVER26OCTFUT
      timeframe: 5m
      parameters:
        fastPeriod: 12
        slowPeriod: 26
        signalPeriod: 9
        histogramScale: 0.5

    - type: bollinger-breakout
      symbol: MCX:SILVER26OCTFUT
      timeframe: 5m
      parameters:
        bandPeriod: 20
        stdDevMultiplier: 2.5
        atrPeriod: 14
        minBandWidthAtrMultiple: 1.5

  candle:
    timeframe-seconds: 60
    derived-timeframes:
      - "5m"
      - "15m"

  queue:
    capacity: 1000

  fyers:
    sidecar:
      url: ws://localhost:8765
      reconnect-delay-millis: 5000